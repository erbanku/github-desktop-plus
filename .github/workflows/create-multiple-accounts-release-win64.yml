name: 'Create Windows 64-bit Release'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.5.4)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows x64 Release
    steps:
      - name: Checkout multiple-accounts branch
        uses: actions/checkout@v4
        with:
          ref: multiple-accounts
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build:prod

      - name: Package Windows x64
        run: yarn package:win64

      - name: Get current datetime
        id: datetime
        run: echo "datetime=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.release_version }}-multi-accounts
          release_name: GitHub Desktop Plus v${{ inputs.release_version }} (Multiple Accounts)
          body: |
            ## GitHub Desktop Plus - Multiple Accounts Support
            
            **Version:** ${{ inputs.release_version }}
            **Branch:** multiple-accounts
            **Build Date:** ${{ steps.datetime.outputs.datetime }}
            
            ### Platform
            - Windows 64-bit (x64)
            
            ### Features
            - Multiple GitHub accounts support
            - All GitHub Desktop Plus enhancements
            - Bitbucket & GitLab integration
            
            ### Installation
            Download and run the installer for your architecture.
            
            ---
            *Built from branch: multiple-accounts*
          draft: true
          prerelease: false

      - name: Upload Windows x64 Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/GitHub-Desktop-Plus-${{ inputs.release_version }}-win-x64.exe
          asset_name: GitHub-Desktop-Plus-${{ inputs.release_version }}-multi-accounts-win-x64.exe
          asset_content_type: application/octet-stream

      - name: Upload Windows x64 MSI
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/GitHub-Desktop-Plus-${{ inputs.release_version }}-win-x64.msi
          asset_name: GitHub-Desktop-Plus-${{ inputs.release_version }}-multi-accounts-win-x64.msi
          asset_content_type: application/x-msi
        continue-on-error: true

      - name: Publish Release
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create_release.outputs.id }},
              draft: false
            })
