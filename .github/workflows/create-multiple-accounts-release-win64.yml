name: 'Create Windows 64-bit Release'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.5.4)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-2022
    name: Build Windows x64 Release
    timeout-minutes: 60
    steps:
      - name: Checkout multiple-accounts branch
        uses: actions/checkout@v4
        with:
          ref: multiple-accounts
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build:prod

      - name: Package Windows x64
        run: yarn package
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}

      - name: Get current datetime
        id: datetime
        run: echo "datetime=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.release_version }}-multi-accounts
          name: GitHub Desktop Plus v${{ inputs.release_version }} (Multiple Accounts)
          body: |
            ## GitHub Desktop Plus - Multiple Accounts Support
            
            **Version:** ${{ inputs.release_version }}
            **Branch:** multiple-accounts
            **Build Date:** ${{ steps.datetime.outputs.datetime }}
            
            ### Platform
            - Windows 64-bit (x64)
            
            ### Features
            - Multiple GitHub accounts support
            - All GitHub Desktop Plus enhancements
            - Bitbucket & GitLab integration
            
            ### Installation
            Download and run the installer for your architecture.
            
            ---
            *Built from branch: multiple-accounts*
          draft: true
          prerelease: false
          files: |
            dist/*.exe
            dist/*.msi

      - name: Publish Release
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const release = releases.data.find(r => r.tag_name === 'v${{ inputs.release_version }}-multi-accounts');
            
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                draft: false
              });
            }
